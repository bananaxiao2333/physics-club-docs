[project]
site_url = "https://pm.079682.xyz/"
site_name = "自由曾在此"
site_description = "英东物理社数字纪念馆 —— 一张社牌，一页讲稿，一次把想法交给双手的尝试。"
site_author = "英东物理社"

copyright = "英东物理社 · 自由曾在此<br>THE CLUB HAS ENDED. THE CURIOSITY HAS NOT."


# extra_css / extra_javascript 必须在任何 [[project.*]] 表之前，
# 否则会被 TOML 归入该表，导致 project.extra_css 为空。
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/mathjax.js", "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js"]

# 分语种的外观文案。
# Zensical 的 site_name / copyright 是全站唯一的，而本站中英共用一次构建，
# 所以英文站名与版权行放在这里，由模板按页面语言取用
# （见 overrides/partials/header.html、footer.html、main.html）。
# ⚠️ 同样必须在 [[project.extra.alternate]] 之前，否则会被归入该表。
[project.extra]
site_name_en = "Freedom Was Here"
copyright_en = "ASJ Yingdong Physics Club · Freedom Was Here<br>THE CLUB HAS ENDED. THE CURIOSITY HAS NOT."
site_author_en = "ASJ Yingdong Physics Club"
# 英文页面包屑的根（对应中文的「序章」）
nav_root_label_en = "Prologue"
site_description_en = "A digital memorial to the ASJ Yingdong Physics Club — a club badge, one page of a speech, and an attempt to put ideas into two hands."
# 主题切换按钮的提示文案（config.theme.palette 里的 toggle.name 是全站唯一的）
palette_toggle_auto_en = "Toggle light/dark"
palette_toggle_light_en = "Switch to dark"
palette_toggle_dark_en = "Switch to light"

[[project.extra.alternate]]
name = "English"
link = "en/"
lang = "en"

[[project.extra.alternate]]
name = "中文"
link = "./"
lang = "zh"


[project.plugins]
awesome-nav = {}
# 图片灯箱：原档与照片页点击放大
glightbox = {}
# 输出压缩
minify = {}

[project.theme]
custom_dir = "overrides"
variant = "modern"
language = "zh"
logo = "assets/club-logo.png"
favicon = "assets/club-logo.png"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# Material 默认配色：跟随系统，浅色优先，无衬线字体。
# 落地页不另立一套主题，而是直接使用这些变量（见 stylesheets/landing.css）。
#
# 强调色（accent）保持 Material 默认的 indigo，具体色值在
# stylesheets/extra.css 里按色调覆盖，原因见那里的注释。
# 注意：Zensical 的 palette.accent 只认 Material 的**颜色名**，
# 写十六进制会被原样塞进 data-md-color-accent 属性而匹配不到任何规则，
# 反而丢掉强调色。所以这里必须是 "indigo"。
[[project.theme.palette]]
media = "(prefers-color-scheme)"
accent = "indigo"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换深浅色"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "切换到浅色"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
